name: Monthly NPI Data Import

on:
  # Run on the 1st of every month at 3am UTC
  schedule:
    - cron: '0 3 1 * *'
  # Also allow manual runs from GitHub Actions tab
  workflow_dispatch:

jobs:
  import-npi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run NPI import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/import-npi.js

      - name: Report success
        if: success()
        run: echo "✅ NPI import completed successfully on $(date)"

      - name: Report failure
        if: failure()
        run: echo "❌ NPI import failed on $(date)"
